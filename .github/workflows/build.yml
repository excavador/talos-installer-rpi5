# Build the pi5 installer and publish it to GHCR.
#
# Replaces a bench registry on a workstation (192.168.1.29:5000) that was a
# single-host SPOF for the image the sole control plane upgrades from.
name: build

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: read pinned versions
        id: v
        run: |
          # yq ships on GitHub runners.
          for k in talos overlay tailscale uboot_repo uboot_tag uboot_path; do
            v="$(yq -r ".${k}" versions.yaml)"
            [ -n "$v" ] && [ "$v" != "null" ] || { echo "versions.yaml: ${k} is empty" >&2; exit 1; }
            echo "${k}=${v}" >> "$GITHUB_OUTPUT"
            echo "  ${k} = ${v}"
          done

      # A tag that disagrees with versions.yaml would publish an image whose
      # name lies about what is inside it. That is the exact failure the
      # estate's pin guard exists to prevent, so refuse here too.
      - name: tag must agree with versions.yaml
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TALOS: ${{ steps.v.outputs.talos }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          case "$tag" in
            "${TALOS}"-*|"${TALOS}") echo "ok: tag $tag matches talos $TALOS" ;;
            *) echo "tag $tag does not start with talos version $TALOS from versions.yaml" >&2; exit 1 ;;
          esac

      - name: fetch our u-boot and verify it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.v.outputs.uboot_repo }}
          TAG: ${{ steps.v.outputs.uboot_tag }}
        run: |
          mkdir -p uboot
          gh release download "$TAG" --repo "$REPO" --dir uboot \
             -p 'u-boot.bin' -p 'u-boot.config' -p 'SHA256SUMS'
          ( cd uboot && sha256sum -c SHA256SUMS )

          # The option this whole image exists for. CI in the u-boot repo
          # asserts it too; repeating it here means a hand-uploaded or stale
          # release asset cannot slip through into a published installer.
          grep -qx 'CONFIG_EFI_RT_VOLATILE_STORE=y' uboot/u-boot.config \
            || { echo "u-boot release lacks CONFIG_EFI_RT_VOLATILE_STORE -- it would not let Talos upgrade pi5" >&2; exit 1; }
          ver="$(strings uboot/u-boot.bin | grep -m1 'U-Boot 20' || true)"
          echo "  u-boot: ${ver:-<no version string>}"
          [ -n "$ver" ] || exit 1

      - name: build the installer with the Talos imager
        env:
          TALOS: ${{ steps.v.outputs.talos }}
          OVERLAY: ${{ steps.v.outputs.overlay }}
          TAILSCALE: ${{ steps.v.outputs.tailscale }}
        run: |
          mkdir -p out
          docker run --rm -t \
            -v "$PWD/out:/out" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --privileged \
            "ghcr.io/siderolabs/imager:${TALOS}" installer \
              --arch arm64 \
              --overlay-name rpi_5 \
              --overlay-image "${OVERLAY}" \
              --system-extension-image "${TAILSCALE}"
          ls -la out/

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: push base, then lay our u-boot over it
        id: push
        env:
          UBOOT_PATH: ${{ steps.v.outputs.uboot_path }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/installer-rpi5"
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="ci-${GITHUB_SHA::12}"
          fi

          go install github.com/google/go-containerregistry/cmd/crane@latest
          export PATH="$PATH:$(go env GOPATH)/bin"

          ART="$(ls out/installer-*.tar | head -1)"
          echo "  imager artifact: $ART"
          crane push "$ART" "${IMAGE}:${TAG}-base"

          # The overlay genuinely ships the Pi 5 board's u-boot under
          # rpi_generic; that mislabelling IS sbc-raspberrypi#96. Replacing
          # this path is what makes the image boot D0 silicon.
          mkdir -p layer/"$(dirname "$UBOOT_PATH")"
          cp uboot/u-boot.bin layer/"$UBOOT_PATH"
          tar cf uboot-layer.tar -C layer --owner=0 --group=0 .

          crane append -b "${IMAGE}:${TAG}-base" -f uboot-layer.tar -t "${IMAGE}:${TAG}"
          echo "image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      # Publishing an installer that does not contain our u-boot would be
      # worse than publishing nothing: it looks correct and reverts pi5's
      # firmware on the next upgrade. Pull the pushed image back and check.
      - name: verify the published image really carries our u-boot
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          UBOOT_PATH: ${{ steps.v.outputs.uboot_path }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          crane export "$IMAGE" - | tar -xO "$UBOOT_PATH" > pulled-u-boot.bin
          a="$(sha256sum uboot/u-boot.bin | awk '{print $1}')"
          b="$(sha256sum pulled-u-boot.bin | awk '{print $1}')"
          echo "  built:     $a"
          echo "  published: $b"
          [ "$a" = "$b" ] || { echo "published image does NOT carry our u-boot" >&2; exit 1; }
          echo "  ok: published installer carries the EFI-capable u-boot"

      - name: summary
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          {
            echo "### published"
            echo
            echo '```'
            echo "$IMAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
